services:
  # ============================================================================
  # PostgreSQL Production Database (Private to Docker Network)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: pdf_extractor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_extractor}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdf_extractor}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # PDF Extractor Engine & Client API Server
  # ============================================================================
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_section_extractor
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pdf_extractor}
      - PDF_WATCH_DIR=/app/watch_pdfs
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-30}
      - SCAN_ON_STARTUP=True
      - DEFAULT_TARGET_SECTION=${DEFAULT_TARGET_SECTION:-16}
      - API_KEY=${API_KEY:-}
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
    volumes:
      # Mount watch directory for incoming crawler PDFs
      - ./watch_pdfs:/app/watch_pdfs
      # Persistent storage mounts for uploads, extracted outputs, and data
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - pdf_data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # Nginx Reverse Proxy (SSL / TLS Termination for AWS Load Balancer)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: pdf_extractor_nginx
    depends_on:
      - pdf-extractor
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pdf_data:
    driver: local
