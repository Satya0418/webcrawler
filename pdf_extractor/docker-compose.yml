services:
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_section_extractor
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - DEBUG=False
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - SQLITE_DB_PATH=/app/data/extractor.db
    volumes:
      # Persistent storage mounts for uploads, extracted outputs, and database
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - pdf_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pdf_data:
    driver: local
