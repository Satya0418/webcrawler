events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    # PDF payloads can be large (support documents up to 100MB)
    client_max_body_size 100M;

    # Upstream application container (matches service name in docker-compose.yml)
    upstream pdf_backend {
        server pdf-extractor:8000;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL / TLS Termination
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Extended timeouts for long-running PDF extraction & OCR operations
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;

        # ALB Health check endpoint
        location /api/health {
            proxy_pass http://pdf_backend/api/health;
        }

        # Main API & frontend routes
        location / {
            proxy_pass http://pdf_backend;
        }
    }
}
