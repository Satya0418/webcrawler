# ==============================================================================
# Production Nginx Configuration for PDF Section Extractor
# Reverse proxy to FastAPI application container (pdf-extractor:8000)
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression for static assets and API JSON/HTML responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Upstream definition for connection pooling & keepalive
    upstream backend_nodes {
        server pdf-extractor:8000 fail_timeout=0;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Maximum request body size (100MB for large multi-page PDF documents)
        client_max_body_size 100M;

        # Reverse proxy all application traffic to FastAPI container
        location / {
            proxy_pass http://pdf-extractor:8000;
            proxy_http_version 1.1;

            # Required Reverse Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for heavy PDF OCR and hierarchical extraction jobs
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering configuration for streaming responses & large downloads
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Nginx-level quick health probe
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # --------------------------------------------------------------------------
    # Production HTTPS / SSL Configuration (Ready to enable for TLS termination)
    # To enable HTTPS:
    # 1. Mount SSL certificates into the container (e.g., /etc/nginx/ssl)
    # 2. Uncomment the listen 443 block and HTTP-to-HTTPS redirect below
